const u = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function open(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u(P.salt), iterations: P.rounds, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u(P.iv) }, k, u(P.data));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
const KEY = "pw:" + location.pathname;
try { const saved = sessionStorage.getItem(KEY); if (saved) open(saved).then(show).catch(() => {}); } catch (e) {}
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  try { const html = await open(pw); try { sessionStorage.setItem(KEY, pw); } catch (x) {} show(html); }
  catch (x) { err.textContent = "הסיסמה לא נכונה. נסו שוב."; go.disabled = false; }
});
